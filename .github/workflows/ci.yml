# CI pipeline: runs automatically on every PR and every push to main
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest # GitHub spins up a fresh Linux machine for free
    defaults:
      run:
        working-directory: terminal-application # all "run" commands execute inside terminal-application/
    steps:
      # 1. Download your repo code onto that machine
      - uses: actions/checkout@v4

      # 2. Install Node.js 20 (with npm cache for speed)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: terminal-application/package-lock.json

      # 3. Clean install of exact versions from package-lock.json
      - run: npm ci

      # 4. Fail the PR if there are lint errors
      - run: npm run lint

      # 5. Fail the PR if the app doesn't compile
      - run: npm run build